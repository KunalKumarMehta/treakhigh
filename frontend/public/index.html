<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TreakHigh Quiz Platform — Real-time quiz telemetry and analytics."
    />
    <title>TreakHigh Quiz Platform</title>
    <style>
      /* Minimal reset for the landing page */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1a1a2e;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 3rem;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 480px;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 0.75rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      p {
        color: #555;
        line-height: 1.6;
      }
      .status {
        margin-top: 1.5rem;
        padding: 0.75rem;
        background: #e8f5e9;
        border-radius: 8px;
        font-size: 0.875rem;
        color: #2e7d32;
      }
      .status::before {
        content: "✓ ";
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>TreakHigh</h1>
      <p>Quiz Platform Telemetry Service</p>
      <div class="status" id="status">Frontend service is running</div>
    </div>

    <!-- Telemetry client — auto-initializes the Web Worker -->
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
