# =============================================================================
# TreakHigh Quiz Platform — Base Docker Compose
# =============================================================================
# ARCHITECTURE DECISION: This is the base layer. Use with env-specific overrides:
#   Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# NETWORK ISOLATION:
#   frontend_net — Nginx ↔ n8n-main only (externally reachable services)
#   backend_net  — All internal services (Postgres, PgBouncer, Redis)
#   Nginx bridges both networks. No other service is exposed to the host
#   except through Nginx.
# =============================================================================

volumes:
  db_storage:
  n8n_storage:
  redis_storage:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true # ← No external access to this network

services:
  # ---------------------------------------------------------------------------
  # FRONTEND — Nginx reverse proxy + static file server
  # ---------------------------------------------------------------------------
  # ARCHITECTURE: Nginx serves the Vanilla JS frontend AND proxies
  # /api/telemetry to n8n. The njs module signs payloads with HMAC
  # server-side, so the secret never reaches the browser.
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: treakhigh-frontend
    restart: unless-stopped
    environment:
      - HMAC_SECRET=${HMAC_SECRET}
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/njs:/etc/nginx/njs:ro
    ports:
      - "80:80"
    networks:
      - frontend_net
      - backend_net # Needs backend to proxy to n8n
    depends_on:
      ingester:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "autoheal=true"

  # ---------------------------------------------------------------------------
  # DATA PERSISTENCE — PostgreSQL
  # ---------------------------------------------------------------------------
  # ARCHITECTURE: Direct access only from backend_net. PgBouncer sits in front.
  # postgresql.conf mounted for production tuning (8GB/4vCPU profile).
  # Migrations run via docker-entrypoint-initdb.d (alphabetical order).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: treakhigh-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # SECURITY: Removed POSTGRES_HOST_AUTH_METHOD=trust.
      # All connections now require password authentication.
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CONNECTION POOLING — PgBouncer
  # ---------------------------------------------------------------------------
  # ARCHITECTURE: Sits between application services and Postgres.
  # Transaction-mode pooling for high concurrency with few backend connections.
  # NOT exposed on host — only reachable from backend_net.
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: treakhigh-pooler
    restart: unless-stopped
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-50}
      - AUTH_TYPE=scram-sha-256
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,statement_timeout
    volumes:
      - ./postgres/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
    # SECURITY: No ports exposed — only backend_net services can reach this.

  # ---------------------------------------------------------------------------
  # INGESTION SERVICE — Golang
  # ---------------------------------------------------------------------------
  # ARCHITECTURE: Dedicated ultra-fast Go microservice handling telemetry payload
  # routing and HMCA signing. Very low memory footprint suitable for 8GB RAM host.
  # ---------------------------------------------------------------------------
  ingester:
    build: ./backend/ingester
    container_name: treakhigh-ingester
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=pgbouncer
      - HMAC_SECRET=${HMAC_SECRET}
      - PORT=8080
    depends_on:
      pgbouncer:
        condition: service_started
    networks:
      - frontend_net # Receives proxied webhook traffic from Nginx
      - backend_net # Writes to PgBouncer

