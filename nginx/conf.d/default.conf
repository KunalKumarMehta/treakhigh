# =============================================================================
# TreakHigh — Nginx Server Block
# =============================================================================
# ARCHITECTURE:
#   - Serves static frontend files from /usr/share/nginx/html
#   - Proxies /api/telemetry to n8n webhook with server-side HMAC signing
#   - Enforces security headers, CORS, and rate limiting
#   - The njs module (hmac-signer.js) signs payloads before proxying,
#     so the HMAC_SECRET never reaches the browser
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # ── Security Headers ─────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self';" always;

    # ── Static Frontend ──────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Telemetry API Proxy ──────────────────────────────────────────────
    # SECURITY: The frontend sends UNSIGNED payloads here.
    # Nginx reads the body, computes HMAC-SHA256 server-side via the njs
    # module, injects the signature header, and proxies to n8n.
    #
    # FLOW: Browser → POST /api/telemetry → Nginx (njs signs) → n8n webhook
    # ─────────────────────────────────────────────────────────────────────
    location /api/telemetry {
        # Rate limiting: 10 req/s per IP, burst 20
        limit_req zone=telemetry_limit burst=20 nodelay;
        limit_req_status 429;

        # CORS headers for the API endpoint
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age       "86400" always;

        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Only allow POST
        limit_except POST {
            deny all;
        }

        # Read the request body so njs can access it
        # The njs module will compute HMAC and add X-Hmac-Signature header
        js_body_filter hmac.sign;

        # Proxy to n8n webhook (internal network — n8n-main on frontend_net)
        proxy_pass http://n8n-main:5678/webhook/quiz-telemetry;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type "application/json";

        # Timeouts for the upstream
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # ── Health Check Endpoint ────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── Block dotfiles ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
