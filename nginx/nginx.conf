# =============================================================================
# TreakHigh — Nginx Main Configuration
# =============================================================================
# ARCHITECTURE: Top-level config with worker tuning, gzip compression,
# rate limiting zones, and security defaults.
# Server blocks are in conf.d/default.conf.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load the njs module for server-side HMAC signing
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1m;       # Telemetry payloads are small (~2KB)

    # ── Gzip Compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Rate Limiting Zone ───────────────────────────────────────────────
    # 10 requests/s per client IP to the telemetry endpoint.
    # Burst of 20 with nodelay allows short bursts without queueing.
    limit_req_zone $binary_remote_addr zone=telemetry_limit:10m rate=10r/s;

    # ── njs Module ───────────────────────────────────────────────────────
    js_path /etc/nginx/njs;
    js_import hmac from hmac-signer.js;

    # ── Server Blocks ───────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
