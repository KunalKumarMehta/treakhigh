# =============================================================================
# TreakHigh — PostgreSQL 15 Production Configuration
# =============================================================================
# Tuned for: 8 GB RAM  /  4 vCPU  /  SSD Storage
# PgBouncer sits in front → keep max_connections LOW.
# =============================================================================

# ── Connection Settings ──────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 100                 # PgBouncer handles 1000+ clients upstream

# ── Memory ───────────────────────────────────────────────────────────────────
shared_buffers = 2GB                  # 25 % of total RAM
effective_cache_size = 6GB            # 75 % of total RAM (OS page cache hint)
work_mem = 64MB                       # Per sort / hash operation
maintenance_work_mem = 512MB          # VACUUM, CREATE INDEX, ALTER TABLE
huge_pages = try                      # Use huge pages when the OS supports them

# ── WAL (Write-Ahead Log) ───────────────────────────────────────────────────
wal_buffers = 64MB                    # -1 = auto (3 % shared_buffers), explicit for clarity
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9    # Spread checkpoint I/O over 90 % of the interval
wal_compression = on                  # Reduce I/O at slight CPU cost

# ── Query Planner ────────────────────────────────────────────────────────────
random_page_cost = 1.1                # SSD-optimized (default 4.0 is for spinning disks)
effective_io_concurrency = 200        # SSD: allow many concurrent I/O requests
default_statistics_target = 100       # Default; increase per-column if needed

# ── Parallelism ──────────────────────────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ── Autovacuum ───────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s              # Check for work every 30 s (default 1 min)
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05 # VACUUM after 5 % of rows change (default 20 %)
autovacuum_analyze_scale_factor = 0.05

# ── Logging ──────────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 250      # Log queries slower than 250 ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                    # Log every temp file creation
log_line_prefix = '%m [%p] %q%u@%d '

# ── Locale & Encoding ───────────────────────────────────────────────────────
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ── JSONB Performance ────────────────────────────────────────────────────────
# GIN indexes on JSONB columns benefit from increasing work_mem and
# maintenance_work_mem (already set above).  No special GUCs needed beyond
# ensuring shared_buffers is large enough to cache the index pages.
