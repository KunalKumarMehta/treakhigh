; =============================================================================
; PgBouncer Configuration — TreakHigh Quiz Platform
; =============================================================================
; ARCHITECTURE: Transaction-mode pooling for high-concurrency quiz telemetry.
; PgBouncer handles 1000+ client connections and multiplexes them over
; a small pool of real Postgres connections.
;
; This file is mounted read-only into the PgBouncer container.
; Connection details (host, user, password) are injected via environment
; variables in docker-compose.yml — NOT hardcoded here.
; =============================================================================

[databases]
; Connection routing — PgBouncer resolves DB_HOST from environment
; The edoburu/pgbouncer image auto-generates this section from env vars.
; This explicit entry is a fallback / documentation reference.
quiz_platform = host=postgres port=5432 dbname=quiz_platform

[pgbouncer]
listen_port = 5432
listen_addr = *
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
admin_users = quiz_admin

; ── Pool Configuration ─────────────────────────────────────────────────────
; Transaction mode: releases connections back to the pool immediately after
; each transaction finishes, rather than waiting for client disconnect.
; Critical for n8n / web app workloads with many short-lived queries.
pool_mode = transaction

; ── Connection Limits ──────────────────────────────────────────────────────
; Max connections from clients (n8n workers, API, etc.)
max_client_conn = 1000

; Max connections PgBouncer opens to Postgres.
; Keep low to prevent Postgres process exhaustion.
default_pool_size = 50

; Emergency admin connections reserved even when pool is full
reserve_pool_size = 5

; ── Timeouts ───────────────────────────────────────────────────────────────
; Kill idle server connections after 5 minutes
server_idle_timeout = 300

; Max time a client can be idle before being disconnected
client_idle_timeout = 600

; Connection lifetime limit (force reconnect to pick up config changes)
server_lifetime = 3600
